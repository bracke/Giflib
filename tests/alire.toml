name = "tests"
description = "AUnit tests for giflib"
version = "0.1.0-dev"
executables = ["giflib_tests"]
project-files = ["unit_tests.gpr"]

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
tags = ["gif", "tests", "aunit"]

#  Changing this value invalidates legacy Alire setup hashes when the generated
#  configuration layout changes.
[gpr-externals]
TESTS_CONFIG_EPOCH = ["1", "legacy"]

[gpr-set-externals]
TESTS_CONFIG_EPOCH = "1"

[[depends-on]]
aunit = "^26.0.0"

[[depends-on]]
project_tools = "*"

[[depends-on]]
gnat_native = "^15"

[[pins]]
project_tools = { path = "../../project_tools" }

[build-profiles]
"*" = "development"
