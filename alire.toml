name = "giflib"
description = "Native Ada GIF87a and GIF89a codec"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = ""
long-description = "giflib is a native Ada 2022 GIF87a/GIF89a decoder and encoder with bounded resource use and forward-only streaming interfaces."
tags = ["gif", "codec", "image", "animation"]

#  Changing this value invalidates legacy Alire setup hashes when the generated
#  configuration layout changes.
[gpr-externals]
GIFLIB_CONFIG_EPOCH = ["1", "legacy"]

[gpr-set-externals]
GIFLIB_CONFIG_EPOCH = "1"

[[depends-on]]
gnat_native = "^15"

[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["alr", "--chdir", "tests", "build", "--development"]

[[actions]]
type = "test"
command = ["alr", "--chdir", "tests", "exec", "--", "gprbuild", "-q", "-p", "-P", "public_api.gpr"]

[[actions]]
type = "test"
command = ["alr", "--chdir", "tests", "exec", "--", "./check_private_api.sh"]

[[actions]]
type = "test"
command = ["alr", "--chdir", "tests", "exec", "--", "sh", "./check_library_interface.sh", ".."]

[[actions]]
type = "test"
command = ["alr", "--chdir", "tests", "exec", "--", "./bin/giflib_tests"]
